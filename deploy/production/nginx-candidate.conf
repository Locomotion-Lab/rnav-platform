limit_req_zone $binary_remote_addr zone=rnav_candidate_login:10m rate=10r/m;
# Parallel loopback-only rehearsal listener. Production 80/443 remains unchanged.
server {
    listen 127.0.0.1:13080;
    server_name r-navigation.com;
    client_max_body_size 22m;
    location ~ ^/api/(v1/)?auth/login$ {
        limit_req zone=rnav_candidate_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:13000;
        proxy_set_header Host r-navigation.com;
        proxy_set_header X-Forwarded-Host r-navigation.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Rnav-Gateway-Token "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_set_header Host r-navigation.com;
        proxy_set_header X-Forwarded-Host r-navigation.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Rnav-Gateway-Token "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 35s;
        proxy_connect_timeout 5s;
    }
}
