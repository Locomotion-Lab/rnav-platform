# Install as /etc/ssh/sshd_config.d/60-rnav-tunnel.conf only after approval.
# Account rnav-tunnel has a locked password, no administrative groups and a dedicated Ed25519 key.
Match User rnav-tunnel
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding remote
    GatewayPorts no
    PermitListen 127.0.0.1:14090
    PermitOpen none
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    MaxSessions 0
Match all
